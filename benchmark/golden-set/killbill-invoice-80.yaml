  - id: KB-Q062
    question: "CAPACITY 用量模式下，多个 unit 的峰值是怎么决定用哪一档价格的？它和 CONSUMABLE 的本质区别是什么？"
    type: positive
    difficulty: hard
    module: invoice
    expected_answer: "CAPACITY 是跨 unit 计费的：每个 unit 用其在周期内出现的峰值（peak）去判断落在哪个 tier，再套用该 tier 的价格（例如 bandwidth 峰值 50、members 峰值 350 落在对应档位就收该档的价格）。而 CONSUMABLE 是对每个 unit 独立计费——分别计算每个 unit 在各 tier 的用量再累加。"
    answer_source: "docs:userguide/subscription/includes/catalog-usage.adoc"
    synonyms: ["CAPACITY 峰值", "capacity tier", "跨 unit 计费", "CONSUMABLE 区别", "peak 决定档位"]
    notes: "catalog-usage.adoc Capacity In Arrear Mode"

  - id: KB-Q063
