  - id: KB-Q059
    question: "新增附加组件时，怎样让它和基础计划共用一个试用期结束时间？"
    type: positive
    difficulty: hard
    module: subscription
    expected_answer: "在 createAlignment 规则里对相应产品使用 START_OF_BUNDLE：附加组件的各阶段会从基础计划最初创建的那天开始，因此如果附加组件配置了与基础计划同样长度的试用期，两者会同时到期；另一种 START_OF_SUBSCRIPTION 则是让附加组件的阶段从它自己创建时开始，适用于让附加组件拥有独立试用期的场景。"
    answer_source: "docs:userguide/subscription/includes/catalog-core.adoc"
    synonyms: ["START_OF_BUNDLE", "START_OF_SUBSCRIPTION", "附加组件试用期", "createAlignment", "addon trial 对齐"]
    notes: "catalog-core.adoc Plan Creation Add-On Phase Alignment"

  - id: KB-Q060
    question: "订阅取消时，entitlement（权限）和 billing（计费）为什么可能不一致？CTD 是什么？"
    type: positive
    difficulty: hard
    module: subscription
    expected_answer: "因为 entitlement 操作与计费是相连但不必对齐的两套东西：用户可以在 entitlement 上立即取消（当场失去服务访问权），但管理员配置的计费策略可能是 END_OF_TERM，于是计费结束日被算到已计费至日期（Charged Through Date，CTD）——也就是最后一次开票周期的结束日，从而不产生信用。CTD 即订阅已被开票覆盖到的那个日期（预付费时为未来日期，后付费时为过去日期）。"
    answer_source: "docs:userguide/subscription/includes/entitlement.adoc"
    synonyms: ["entitlement 与 billing", "CTD", "Charged Through Date", "取消不产生信用", "权限计费不一致"]
    notes: "entitlement.adoc Overview；glossary CTD"

