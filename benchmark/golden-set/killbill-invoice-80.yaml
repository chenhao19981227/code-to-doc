  - id: KB-Q057
    question: "附加组件（ADD_ON）通常使用哪种计费对齐方式？如果 BCD 落在当月不存在的日期（比如 4 月 31 日）会怎么处理？"
    type: positive
    difficulty: medium
    module: subscription
    expected_answer: "附加组件常用 BUNDLE 对齐，即把 BCD 设成基础计划（base plan）所用的那一天。如果 BCD 落到当月不存在的日期（如 4 月 31 日），系统会把它设为该月的最后一天。"
    answer_source: "docs:userguide/subscription/includes/catalog-core.adoc"
    synonyms: ["BUNDLE 对齐", "附加组件 BCD", "BCD 月末", "billing alignment BUNDLE", "4月31日"]
    notes: "catalog-core.adoc Billing Alignment Rules"

  - id: KB-Q058
