  # ================= 新增正样本 —— 目录/订阅 =================
  - id: KB-Q055
    question: "Kill Bill 怎么表示 catalog（目录）的版本？想改价格但让现有订阅晚些时候才生效，怎么实现？"
    type: positive
    difficulty: hard
    module: subscription
    expected_answer: "catalog 没有真正的版本号：每个 catalog XML 带一个 effectiveDate，系统按 effectiveDate 排序形成多个版本，后一个版本取代前一个。若想让改价对新订阅立即生效、但现有订阅延后生效，可在 Plan 上使用 effectiveDateForExistingSubscriptions 字段——新订阅立即用新价，现有订阅只有到该日期之后才启用新价。"
    answer_source: "docs:userguide/subscription/includes/catalog-core.adoc"
    synonyms: ["catalog 版本", "effectiveDate", "effectiveDateForExistingSubscriptions", "延迟改价", "目录版本管理"]
    notes: "catalog-core.adoc Catalog Versions + Deferred Price Change"

  - id: KB-Q056
    question: "目录里 plan/phase 的 name 有什么命名限制？name 和 prettyName 有什么区别？"
    type: positive
    difficulty: hard
    module: subscription
    expected_answer: "name 必须在整个目录里全局唯一，且必须符合 XML NCName 规范：不能包含冒号、@、$、%、&、斜杠、加号、逗号、分号等符号、不能含空白字符或括号，也不能以数字、点或减号开头。prettyName 是展示名（会反映到发票项目上），适合在产品改名/重命名时使用，这样就不必改动 name。"
    answer_source: "docs:userguide/subscription/includes/catalog-core.adoc"
