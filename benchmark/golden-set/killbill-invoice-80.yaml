    type: positive
    difficulty: hard
    module: subscription
    expected_answer: "三个值：END_OF_TERM（在当前已计费周期结束时变更）、IMMEDIATE（请求时立即变更）、ILLEGAL（不允许该计划变更）。"
    answer_source: "docs:userguide/subscription/includes/catalog-core.adoc"
