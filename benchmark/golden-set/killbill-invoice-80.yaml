    type: positive
    difficulty: hard
    module: invoice
    expected_answer: "max 设为 -1 表示无上界（即最后一个不限量的阶梯）。tieredBlock 的 size 是计价块大小：例如 size=10 表示每 10 个单位作为一个计价块，按该块的 price 收费；其 max 表示这种 size 的块最多可用多少块，超过就进入下一档价格。"
    answer_source: "docs:userguide/subscription/includes/catalog-usage.adoc"
    synonyms: ["tier max -1", "无上界阶梯", "tieredBlock size", "计价块", "用量阶梯定义"]
    notes: "catalog-usage.adoc ALL_TIER 示例"

  - id: KB-Q064
